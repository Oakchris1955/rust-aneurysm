name: Run Cargo tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
